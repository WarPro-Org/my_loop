name: CI

# Once per PR commit (PRs into any branch, so stacked PRs get CI too), plus after each merge.
# A push to a branch with a PR used to run CI twice.
on:
  push:
    branches: [develop, main, master]
  pull_request:
  workflow_dispatch: # It unlocks manual terminal and UI execution.

jobs:
  # Docs (docs/, any *.md) and agent skills/config (.claude/) don't affect the app, so a change that
  # touches only those skips the jobs below. GitHub counts a skipped job as passed, so required checks
  # still clear. If this check can't tell (or fails), the jobs run: it never skips by mistake.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: .github/scripts/code-changed.sh >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (.NET API)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore api/MyLoop.Api/MyLoop.Api.csproj

      - name: Build
        run: dotnet build api/MyLoop.Api/MyLoop.Api.csproj --configuration Release --no-restore

      # Old test suites and coverage gates are paused during the 0.x rebuild
      # (see CLAUDE.md -> Planning Chat & User Stories). The old test project is
      # still compiled, so a change that breaks it can't reach master. Only the 0.1
      # user-story tests run: one folder per story in tests/MyLoop.V01.Tests.
      - name: Build old tests (not run)
        run: dotnet build tests/MyLoop.Api.Tests/MyLoop.Api.Tests.csproj --configuration Release

      - name: Test (0.1 user stories)
        run: dotnet test tests/MyLoop.V01.Tests/MyLoop.V01.Tests.csproj --configuration Release

  mobile:
    name: Mobile (Flutter)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Tests and coverage paused during the 0.x rebuild (see backend job note).

  # ADD THIS NEW JOB TO UNBLOCK YOUR GITHUB PRs
  security-scan:
    name: Security Code Scanning
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload results to the Security tab
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'csharp' # Scan your .NET 10 API code for vulnerabilities

      # CodeQL needs to see a build happen for compiled languages like C#
      - name: Setup .NET 10 for Scan
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build API for Scan
        run: |
          dotnet restore api/MyLoop.Api/MyLoop.Api.csproj
          dotnet build api/MyLoop.Api/MyLoop.Api.csproj --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
