name: PR rules

# Checks each PR against the CLAUDE.md rules a machine can check: gate section and "Skills run"
# (Claude-made and FR PRs), task link and an approved design doc on the base branch (FR PRs), size.
# Runs on description edits too, so fixing the description re-runs it. Separate from CI so a
# description edit never re-runs the build.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-rules:
    name: PR rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the merge commit and its parents: base (^1) and PR head (^2)

      - name: Check PR against CLAUDE.md rules
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDED: ${{ github.event.pull_request.additions }}
          PR_DELETED: ${{ github.event.pull_request.deletions }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: .github/scripts/pr-rules.sh
